  <body class="bg-[#08080A] text-[#F5F5F7] antialiased selection:bg-[#E50914] selection:text-white">
    <div id="root">
      <!-- Экран загрузки: виден, пока не смонтировалось приложение. Если скрипт
           не загрузился/упал, ниже появится понятное сообщение об ошибке. -->
      <div
        id="boot-screen"
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:Manrope,system-ui,sans-serif;background:#08080A;color:#F5F5F7"
      >
        <div style="font-family:Unbounded,system-ui,sans-serif;font-size:22px;letter-spacing:.28em;font-weight:800">F304LTEAM</div>
        <div style="width:180px;height:2px;background:#27272F;overflow:hidden;border-radius:99px">
          <div style="width:40%;height:100%;background:#E50914;animation:bootslide 1.1s ease-in-out infinite"></div>
        </div>
        <div id="boot-note" style="font-size:13px;color:#8A8A96">Загрузка платформы…</div>
      </div>
      <style>
        @keyframes bootslide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(350%); }
        }
      </style>
    </div>
    <script>
      // Диагностика на клиенте: любые ошибки показываем прямо на экране,
      // а не оставляем пользователя с пустой страницей.
      (function () {
        var shown = false;
        function showError(text) {
          if (shown) return;
          shown = true;
          var note = document.getElementById("boot-note");
          if (note) {
            note.style.color = "#E50914";
            note.style.maxWidth = "520px";
            note.style.textAlign = "center";
            note.style.lineHeight = "1.6";
            note.textContent = "Ошибка загрузки: " + text;
          }
        }
        window.addEventListener("error", function (e) {
          showError((e && (e.message || (e.target && e.target.src))) || "неизвестная ошибка");
        });
        window.addEventListener("unhandledrejection", function (e) {
          showError((e && e.reason && (e.reason.message || e.reason)) || "promise rejection");
        });
        setTimeout(function () {
          if (document.getElementById("boot-screen") && !window.__F304L_BOOTED__) {
            showError("скрипт приложения не запустился за 12 секунд");
          }
        }, 12000);
      })();
    </script>
  </body>
