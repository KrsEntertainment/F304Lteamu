# Деплой одной кнопкой на Render (бесплатный тариф)
services:
  - type: web
    name: f304lteam
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: f304lteam-data
      mountPath: /data
      sizeGB: 1
